# Сборка через dotnet SDK (.NET Framework 4.8 target) + юнит-тесты + смоук GUI —
# матрицей по разрядности (x64 и x86): каждый пакет собирается, самопроверяется
# СВОИМ exe (32-битный гоняется в WOW64) и валидирует свой установщик со своим
# Ghostscript. Интеграционные тесты (tests/verify*.ps1) требуют установленные
# Office/Excel/Word и выполняются только локально: tests\run_all.cmd.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read # релиз собирается и подписывается локально (tools\make_release.ps1)

# Новый push в ту же ветку PR отменяет устаревший прогон; прогоны main и тегов доводятся до конца.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Действия закреплены по SHA коммита (в комментарии — версия): подвижный тег может указать на
# другой код без изменения этого файла. Поднимаются вручную: Dependabot не подходит — его
# коммиты с чужим автором не пройдут проверку авторства (задача docs ниже).
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90 # обычный прогон — около 15 минут; зависание не держит раннер 6 часов
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            dist: dist
            gs_choco: ''
          - arch: x86
            dist: dist/x86
            gs_choco: '--x86'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Установка .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      # Пакеты NuGet между прогонами: ключ — файлы проектов, где записаны версии пакетов.
      - name: Кэш пакетов NuGet
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-${{ matrix.arch }}-

      - name: Сборка приложения
        shell: cmd
        run: call build.cmd ${{ matrix.arch }}

      # Ghostscript ставим ДО юнит-тестов: иначе живой тест сжатия молча уходил в ветку
      # «движка нет», и настоящие проверки (сжатие применилось, размер уменьшился, заголовок
      # PDF цел, страницы не потеряны) в CI не выполнялись ни разу.
      # choco ВОЗВРАЩАЕТ НОЛЬ, даже когда не поставил ничего: 2026-07-28 фид отдавал 504 и
      # 503, в логе стояло «installed 0/1 packages», а шаг был зелёным — отказ всплывал через
      # два шага и указывал на Ghostscript вместо установки. Поэтому: повтор при временном
      # сбое сети (5xx на стороне фида проходят сами) и ЯВНАЯ проверка, что пакет на месте.
      # Успех попытки решает ТОЛЬКО эта проверка: 2026-10-26 фид отдал 504, choco написал
      # «installed 0/0 packages» без «packages failed» и вернул 0 — шаг ушёл дальше без
      # повтора. Не поставился после трёх попыток — падаем здесь и с правильной причиной:
      # собирать дальше можно, но проверять сжатие уже нечем, а зелёная сборка лжёт.
      # Версии закреплены (CI-7): сборка не меняется сама от выхода нового пакета. Ghostscript
      # не ниже 10.08.0 (CVE-2026-39919); поднимать версию — вручную, сверяясь с stage_gs.ps1.
      - name: Ghostscript и Inno Setup (сжатие и установщик)
        shell: pwsh
        timeout-minutes: 30
        run: |
          function Test-PackageInstalled([string]$package) {
            if ($package -eq 'ghostscript') {
              $dll = if ('${{ matrix.arch }}' -eq 'x86') { 'gsdll32.dll' } else { 'gsdll64.dll' }
              $roots = Get-ChildItem "$env:ProgramFiles\gs", "${env:ProgramFiles(x86)}\gs" `
                -Directory -ErrorAction SilentlyContinue
              return [bool]($roots | Where-Object { Test-Path (Join-Path $_.FullName "bin\$dll") })
            }
            $iscc = Get-ChildItem "$env:ProgramFiles", "${env:ProgramFiles(x86)}" `
              -Directory -Filter 'Inno Setup *' -ErrorAction SilentlyContinue |
              ForEach-Object { Join-Path $_.FullName 'ISCC.exe' } |
              Where-Object { Test-Path $_ }
            return [bool]$iscc
          }

          function Invoke-ChocoAttempt([string]$package, [string]$extra, [int]$number) {
            $id = [guid]::NewGuid().ToString('N')
            $stdout = Join-Path $env:RUNNER_TEMP "$package-$id.out"
            $stderr = Join-Path $env:RUNNER_TEMP "$package-$id.err"
            $arguments = @('install', $package, '--no-progress', '-y', '--execution-timeout=240')
            if ($extra) { $arguments += $extra }
            Write-Host "== $package, попытка $number из 3 (не более 4 минут) =="
            try {
              $process = Start-Process choco.exe -ArgumentList $arguments -PassThru -NoNewWindow `
                -RedirectStandardOutput $stdout -RedirectStandardError $stderr
              $finished = $process.WaitForExit(240000)
              if (-not $finished) {
                Write-Host "::warning::${package}: choco не завершился за 4 минуты"
                try { $process.Kill($true) } catch { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
                $process.WaitForExit()
              }
              $log = ((Get-Content $stdout -Raw -ErrorAction SilentlyContinue) +
                      (Get-Content $stderr -Raw -ErrorAction SilentlyContinue))
              Write-Host $log
              return [pscustomobject]@{ Finished = $finished; ExitCode = $process.ExitCode; Log = $log }
            } finally {
              Remove-Item $stdout, $stderr -Force -ErrorAction SilentlyContinue
            }
          }

          function Install-WithRetry([string]$package, [string]$extra) {
            for ($try = 1; $try -le 3; $try++) {
              $result = Invoke-ChocoAttempt $package $extra $try
              if (Test-PackageInstalled $package) {
                Write-Host "$package установлен"
                return
              }
              Write-Host "::warning::${package}: попытка $try не поставила пакет (код $($result.ExitCode), завершён: $($result.Finished))"
              if ($try -lt 3) { Start-Sleep -Seconds (15 * $try) }
            }
            Write-Host "::error::$package не установлен после трёх ограниченных попыток"
            exit 1
          }
          Install-WithRetry 'ghostscript' '--version=10.8.0 ${{ matrix.gs_choco }}'
          Install-WithRetry 'innosetup' '--version=6.7.1'
          $gs = Get-ChildItem "$env:ProgramFiles\gs", "${env:ProgramFiles(x86)}\gs" -Directory -ErrorAction SilentlyContinue
          if (-not $gs) { Write-Host '::error::Ghostscript не найден после установки'; exit 1 }
          Write-Host ('Ghostscript: ' + ($gs | ForEach-Object { $_.FullName }) -join ', ')

      # Тесты собираются СВОЕЙ разрядностью: иначе обе ветки матрицы гоняли один и тот же
      # 64-битный exe и ветки IntPtr.Size == 4 не проверялись.
      # Строгий режим: пропуск теста — провал, кроме пропусков из-за отсутствующего Office (на
      # раннере его нет). Иначе сорванная установка Ghostscript или пропавшая фикстура давали
      # бы зелёный прогон, который ничего не проверил (TS-2, TS-4). Журнал — артефактом.
      - name: Юнит-тесты
        shell: pwsh
        timeout-minutes: 40 # обычно 7–8 минут; зависший тест раньше останавливает сторож раннера (10 мин)
        env:
          IWO_STRICT: '1'
          IWO_OPTIONAL: office
        run: |
          cmd /c "tests\build_tests.cmd ${{ matrix.arch }}" 2>&1 | Tee-Object -FilePath "unit-tests-${{ matrix.arch }}.log"
          exit $LASTEXITCODE

      - name: Журнал юнит-тестов
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-tests-${{ matrix.arch }}
          path: unit-tests-${{ matrix.arch }}.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Смоук-тест GUI (создание окон без показа, руководство внутри exe)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\${{ matrix.dist }}\iwoHelperDesktop.exe -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Host "selftest exit=$($p.ExitCode) (3 = окно не создалось, 4 = в exe нет руководства/лицензий)"; exit 1 }

      - name: Проверка вшитого PdfSharp
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\${{ matrix.dist }}\iwoHelperDesktop.exe -ArgumentList '--pdfcheck' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Host "pdfcheck exit=$($p.ExitCode)"; exit 1 }

      - name: Проверка вшитого PdfPig (извлечение текста born-digital PDF)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\${{ matrix.dist }}\iwoHelperDesktop.exe -ArgumentList '--pdftextcheck' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Host "pdftextcheck exit=$($p.ExitCode)"; exit 1 }

      - name: Проверка первого запуска embedded PDF-библиотек из пустой папки
        shell: pwsh
        run: .\tests\verify_embedded.ps1 -Arch ${{ matrix.arch }}

      - name: Проверка сборки .pptx своими силами (PDF → PowerPoint, без Office)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\${{ matrix.dist }}\iwoHelperDesktop.exe -ArgumentList '--pptxcheck' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Host "pptxcheck exit=$($p.ExitCode)"; exit 1 }

      # Код 2 = рендер не состоялся: проверять было нечего, и это ТОЖЕ отказ шага —
      # иначе защита от ERROR_USER_MAPPED_FILE могла бы пропасть при зелёном CI.
      - name: Чистый выход после рендера миниатюр (WinRT)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\${{ matrix.dist }}\iwoHelperDesktop.exe -ArgumentList '--thumbcheck' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Host "thumbcheck exit=$($p.ExitCode) (2 = рендер не состоялся)"; exit 1 }

      # Сам режим при отсутствии Ghostscript возвращает 0 (сжатие опционально), поэтому здесь
      # дополнительно требуем в выводе «exe=»: без этого сорванная установка Ghostscript была
      # бы неотличима от успешного round-trip.
      - name: Проверка сжатия PDF (Ghostscript round-trip)
        shell: pwsh
        run: |
          $out = & .\${{ matrix.dist }}\iwoHelperDesktop.exe --gscheck 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { Write-Host "gscheck exit=$LASTEXITCODE"; exit 1 }
          if ($out -notmatch 'exe=') { Write-Host 'Ghostscript не найден — round-trip не проверен'; exit 1 }

      - name: Подготовка Ghostscript для установщика
        shell: pwsh
        run: .\tools\stage_gs.ps1 -Arch ${{ matrix.arch }}

      - name: Сборка установщика (валидация .iss)
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "$env:ProgramFiles","${env:ProgramFiles(x86)}" -Directory -Filter 'Inno Setup *' -ErrorAction SilentlyContinue |
            ForEach-Object { Join-Path $_.FullName 'ISCC.exe' } | Where-Object { Test-Path $_ } |
            Sort-Object -Descending | Select-Object -First 1
          if (-not $iscc) { Write-Host 'ISCC.exe не найден'; exit 1 }
          # Без /DAppVersion: версия берётся из собранного exe своей разрядности
          # (фолбэк в .iss). Нечисловое значение (как раньше "ci") ломает VersionInfoVersion.
          & $iscc "/DArch=${{ matrix.arch }}" .\installer\iwoHelperDesktop.iss
          if ($LASTEXITCODE -ne 0) { Write-Host "iscc exit=$LASTEXITCODE"; exit 1 }

      - name: Артефакт сборки
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iwoHelperDesktop-${{ matrix.arch }}
          path: ${{ matrix.dist }}/iwoHelperDesktop.exe
          retention-days: 30

      - name: Артефакт установщика (без подписи — подпись локально)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iwoHelperDesktop-setup-${{ matrix.arch }}
          path: dist/iwoHelperDesktop-setup-*.exe
          retention-days: 30

      # Релизы на GitHub создаются ЛОКАЛЬНО (tools\make_release.ps1): все четыре
      # артефакта (portable + installer, x64 + x86) подписываются самоподписанным
      # сертификатом, который есть только на машине мейнтейнера. CI лишь собирает,
      # тестирует и валидирует установщики.

  # Ссылки README — отдельной задачей и ОДИН раз: они не зависят от разрядности, а
  # в матрице сборки удвоили бы обращения к GitHub и приблизили лимит на запросы без
  # ключа. Битая ссылка на странице проекта — первое, что видит пришедший, и
  # единственное, что никто никогда не перечитывает: адреса файлов релиза прибиты к
  # версии, а якорь заголовка с эмодзи несёт невидимый U+FE0F и ломается незаметно.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Вся история и все теги: проверка авторства смотрит каждый достижимый коммит,
      # а при неглубокой копии видела бы один последний.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      - name: Ссылки README (адреса, якоря разделов, пути в репозитории)
        run: python tools/check_readme_links.py

      - name: Тесты проверки авторства коммитов и хука commit-msg
        run: python -m unittest discover -s tools -p "test_*.py" -v

      # В истории — только коммиты автора проекта и без строк соавторства: список участников
      # GitHub строит из них, и исправить его потом можно только переписав историю. У запроса
      # на слияние проверять нечего — в main попадает то, что зальёт сам автор.
      - name: Авторство коммитов и тегов
        if: github.event_name != 'pull_request'
        run: python tools/check_commit_metadata.py
