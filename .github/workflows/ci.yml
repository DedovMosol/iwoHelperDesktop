# Сборка через dotnet SDK (.NET Framework 4.8 target) + юнит-тесты + смоук GUI —
# матрицей по разрядности (x64 и x86): каждый пакет собирается, самопроверяется
# СВОИМ exe (32-битный гоняется в WOW64) и валидирует свой установщик со своим
# Ghostscript. Интеграционные тесты (tests/verify*.ps1) требуют установленные
# Office/Excel/Word и выполняются только локально: tests\run_all.cmd.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read # релиз собирается и подписывается локально (tools\make_release.ps1)

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            dist: dist
            gs_choco: ''
          - arch: x86
            dist: dist/x86
            gs_choco: '--x86'
    steps:
      - uses: actions/checkout@v4

      - name: Установка .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Сборка приложения
        shell: cmd
        run: call build.cmd ${{ matrix.arch }}

      # Ghostscript ставим ДО юнит-тестов: иначе живой тест сжатия молча уходил в ветку
      # «движка нет», и настоящие проверки (сжатие применилось, размер уменьшился, заголовок
      # PDF цел, страницы не потеряны) в CI не выполнялись ни разу.
      # choco ВОЗВРАЩАЕТ НОЛЬ, даже когда не поставил ничего: 2026-07-28 фид отдавал 504 и
      # 503, в логе стояло «installed 0/1 packages», а шаг был зелёным — отказ всплывал через
      # два шага и указывал на Ghostscript вместо установки. Поэтому: повтор при временном
      # сбое сети (5xx на стороне фида проходят сами) и ЯВНАЯ проверка, что пакет на месте.
      # Не поставился после трёх попыток — падаем здесь и с правильной причиной: собирать
      # дальше можно, но проверять сжатие уже нечем, а зелёная сборка без этой проверки лжёт.
      - name: Ghostscript и Inno Setup (сжатие и установщик)
        shell: pwsh
        run: |
          function Install-WithRetry([string]$package, [string]$extra) {
            for ($try = 1; $try -le 3; $try++) {
              Write-Host "== $package, попытка $try из 3 =="
              $log = & choco install $package --no-progress -y $extra 2>&1 | Out-String
              Write-Host $log
              if ($log -notmatch 'packages failed') { return }
              if ($try -lt 3) { Start-Sleep -Seconds (15 * $try) }
            }
            Write-Host "::error::$package не установлен после трёх попыток (фид Chocolatey недоступен?)"
            exit 1
          }
          Install-WithRetry 'ghostscript' '${{ matrix.gs_choco }}'
          Install-WithRetry 'innosetup' ''
          # Проверка НАЛИЧИЯ, а не текста вывода: «installed 0/1 packages» без слова failed
          # означает «уже стоит», и разбирать английские фразы choco — ненадёжная опора.
          # Каталог на месте — установка удалась, чем бы choco ни отчитался.
          $gs = Get-ChildItem "$env:ProgramFiles\gs", "${env:ProgramFiles(x86)}\gs" -Directory -ErrorAction SilentlyContinue
          if (-not $gs) { Write-Host '::error::Ghostscript не найден после установки'; exit 1 }
          Write-Host ('Ghostscript: ' + ($gs | ForEach-Object { $_.FullName }) -join ', ')

      # Тесты собираются СВОЕЙ разрядностью: иначе обе ветки матрицы гоняли один и тот же
      # 64-битный exe и ветки IntPtr.Size == 4 не проверялись.
      - name: Юнит-тесты
        shell: cmd
        run: call tests\build_tests.cmd ${{ matrix.arch }}

      - name: Смоук-тест GUI (создание окон без показа, руководство внутри exe)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\${{ matrix.dist }}\iwoHelperDesktop.exe -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Host "selftest exit=$($p.ExitCode) (3 = окно не создалось, 4 = в exe нет руководства)"; exit 1 }

      - name: Проверка вшитого PdfSharp
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\${{ matrix.dist }}\iwoHelperDesktop.exe -ArgumentList '--pdfcheck' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Host "pdfcheck exit=$($p.ExitCode)"; exit 1 }

      - name: Проверка вшитого PdfPig (извлечение текста born-digital PDF)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\${{ matrix.dist }}\iwoHelperDesktop.exe -ArgumentList '--pdftextcheck' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Host "pdftextcheck exit=$($p.ExitCode)"; exit 1 }

      # Код 2 = рендер не состоялся: проверять было нечего, и это ТОЖЕ отказ шага —
      # иначе защита от ERROR_USER_MAPPED_FILE могла бы пропасть при зелёном CI.
      - name: Чистый выход после рендера миниатюр (WinRT)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\${{ matrix.dist }}\iwoHelperDesktop.exe -ArgumentList '--thumbcheck' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Host "thumbcheck exit=$($p.ExitCode) (2 = рендер не состоялся)"; exit 1 }

      # Сам режим при отсутствии Ghostscript возвращает 0 (сжатие опционально), поэтому здесь
      # дополнительно требуем в выводе «exe=»: без этого сорванная установка Ghostscript была
      # бы неотличима от успешного round-trip.
      - name: Проверка сжатия PDF (Ghostscript round-trip)
        shell: pwsh
        run: |
          $out = & .\${{ matrix.dist }}\iwoHelperDesktop.exe --gscheck 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { Write-Host "gscheck exit=$LASTEXITCODE"; exit 1 }
          if ($out -notmatch 'exe=') { Write-Host 'Ghostscript не найден — round-trip не проверен'; exit 1 }

      - name: Подготовка Ghostscript для установщика
        shell: pwsh
        run: .\tools\stage_gs.ps1 -Arch ${{ matrix.arch }}

      - name: Сборка установщика (валидация .iss)
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "$env:ProgramFiles","${env:ProgramFiles(x86)}" -Directory -Filter 'Inno Setup *' -ErrorAction SilentlyContinue |
            ForEach-Object { Join-Path $_.FullName 'ISCC.exe' } | Where-Object { Test-Path $_ } |
            Sort-Object -Descending | Select-Object -First 1
          if (-not $iscc) { Write-Host 'ISCC.exe не найден'; exit 1 }
          # Без /DAppVersion: версия берётся из собранного exe своей разрядности
          # (фолбэк в .iss). Нечисловое значение (как раньше "ci") ломает VersionInfoVersion.
          & $iscc "/DArch=${{ matrix.arch }}" .\installer\iwoHelperDesktop.iss
          if ($LASTEXITCODE -ne 0) { Write-Host "iscc exit=$LASTEXITCODE"; exit 1 }

      - name: Артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: iwoHelperDesktop-${{ matrix.arch }}
          path: ${{ matrix.dist }}/iwoHelperDesktop.exe

      - name: Артефакт установщика (без подписи — подпись локально)
        uses: actions/upload-artifact@v4
        with:
          name: iwoHelperDesktop-setup-${{ matrix.arch }}
          path: dist/iwoHelperDesktop-setup-*.exe

      # Релизы на GitHub создаются ЛОКАЛЬНО (tools\make_release.ps1): все четыре
      # артефакта (portable + installer, x64 + x86) подписываются самоподписанным
      # сертификатом, который есть только на машине мейнтейнера. CI лишь собирает,
      # тестирует и валидирует установщики.

  # Ссылки README — отдельной задачей и ОДИН раз: они не зависят от разрядности, а
  # в матрице сборки удвоили бы обращения к GitHub и приблизили лимит на запросы без
  # ключа. Битая ссылка на странице проекта — первое, что видит пришедший, и
  # единственное, что никто никогда не перечитывает: адреса файлов релиза прибиты к
  # версии, а якорь заголовка с эмодзи несёт невидимый U+FE0F и ломается незаметно.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Ссылки README (адреса, якоря разделов, пути в репозитории)
        run: python tools/check_readme_links.py
